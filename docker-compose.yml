# radius-gateway in front of your API. Copy .env.example to .env and fill it in, then:
#
#   docker compose build
#   docker compose up -d
#
# nginx (or your TLS terminator) then proxies https traffic to 127.0.0.1:8080; see the README.

services:
  gateway:
    build:
      context: .
      args:
        RADIUS_GATEWAY_COMMIT: ${RADIUS_GATEWAY_COMMIT:-unknown}
    image: radius-gateway:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # the proxy
      - "127.0.0.1:9901:9901"   # admin: /healthz, /readyz, /policy, /version; keep it local
    # To customize the payment page, export the built-in files with
    #   docker compose run --rm gateway --export-pages /pages   (with the volume below)
    # edit them, and set PAGES_DIR=/pages in .env.
    # volumes:
    #   - ./pages:/pages
    extra_hosts:
      # So UPSTREAM=http://host.docker.internal:3000 reaches an API on the Docker host (Linux).
      - "host.docker.internal:host-gateway"
