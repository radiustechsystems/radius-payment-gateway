# The platform crates come from a private GitHub repository over ssh. Cargo's built-in git
# fetcher can't use every ssh setup (key files, agents, config hosts); the git CLI can.
[net]
git-fetch-with-cli = true

# Developing against a local radius-platform checkout? Uncomment to build the policy evaluator
# from it instead of the pinned revision. Don't commit a Cargo.lock produced this way.
# [patch."ssh://git@github.com/radiustechsystems/radius-platform.git"]
# policy = { path = "../radius-platform/crates/policy" }
# domain = { path = "../radius-platform/crates/domain" }
